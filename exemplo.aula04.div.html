<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo: div, br e hr</title>


    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }
        #principal {
            background-color: black;
            border: 2px solid blue ;
            color: aqua;
        }
        hr{
            border: none;
            border-top: 3px solid rgb(255, 192, 192);
            width: 90%;
        }
        #secundaria {
            background-color: black;
            border: 2px solid blueviolet ;
            color: rgb(255, 0, 212);
        }


    </style>




</head>
<body>
    <div id = "principal">
        esta é a primeira linha.
        <br>
        esta é a segunda linha 
    </div>
      <hr>
      
    <div id = "secundaria">
        esta é outra divisão da pagina. 
        <br>
        aqui começa uma nova linha. 
    </div>

</body>
</html>
